version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
  # pip dependencies
  - package-ecosystem: "pip"
    directory: "/" # points to requirements.txt
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
